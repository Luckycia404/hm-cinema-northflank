// ── Helpers ─────────────────────────────────────────────────────────────────
function fmt(s) {
    if (!s || isNaN(s)) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    return `${m}:${String(sec).padStart(2,'0')}`;
}

function isUrlExpired(url) {
    try { const m=(url||'').match(/[?&]t=(\d+)/); return m ? Math.floor(Date.now()/1000)>parseInt(m[1]):false; }
    catch(e){ return false; }
}

async function fetchAPI(endpoint) {
    const ctrl = new AbortController();
    const tid  = setTimeout(()=>ctrl.abort(), 15000);
    const res  = await fetch(endpoint, { signal: ctrl.signal });
    clearTimeout(tid);
    if (!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
}

function showQuickMsg(msg, type) {
    document.querySelectorAll('.quick-msg').forEach(e=>e.remove());
    const el = document.createElement('div');
    el.className = 'quick-msg';
    el.style.borderLeft = `3px solid ${type==='error'?'#e50914':type==='success'?'#22c55e':'#3b82f6'}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 2000);
}

// ── Playback position save / restore ────────────────────────────────────────
function playbackKey(id) {
    return 'pb_'+id+(currentSeason?'_s'+currentSeason+'e'+currentEpisode:'');
}
function savePosition() {
    if (!currentMovieId || video.currentTime < 5 || !video.duration) return;
    const pct = video.currentTime / video.duration * 100;
    if (pct < 95) {
        localStorage.setItem(playbackKey(currentMovieId), JSON.stringify({
            t: video.currentTime, dur: video.duration, ts: Date.now()
        }));
    } else {
        localStorage.removeItem(playbackKey(currentMovieId));
    }
}
function restorePosition() {
    const raw = localStorage.getItem(playbackKey(currentMovieId));
    if (!raw) return false;
    try {
        const d = JSON.parse(raw);
        const daysSince = (Date.now()-d.ts)/(1000*60*60*24);
        if (daysSince<30 && d.t>5) {
            video.addEventListener('loadeddata', function onLD() {
                video.removeEventListener('loadeddata', onLD);
                video.currentTime = d.t;
                showQuickMsg('Resuming from '+fmt(d.t),'info');
            });
            return true;
        }
    } catch(e) {}
    return false;
}

// ── Source helpers ──────────────────────────────────────────────────────────
function sourceQualityLabel(source, index) {
    const url = source?.streamUrl||source?.proxyUrl||source?.directUrl||source?.cdnUrl||source?.url||'';
    if (isDashSource(source, url)) return 'Auto (DASH)';

    const raw = String(source?.quality || source?.resolution || source?.label || '').trim();
    const numeric = raw.match(/\d{3,4}/);
    if (numeric) return numeric[0] + 'p';
    if (raw) return raw;
    return 'Stream ' + (index + 1);
}

function enhanceSources(sources) {
    if (!Array.isArray(sources)) return [];
    return sources.map((s,i)=>{
        let q = s.quality||'';
        const url = s.streamUrl||s.proxyUrl||s.directUrl||s.url||'';
        if (!q && url){ const m=url.match(/(\d+p|HD|SD|FHD|UHD|4K)/i); if(m) q=m[1].toUpperCase(); }
        return {...s, quality:q||'Stream '+(i+1), label:sourceQualityLabel(s,i)};
    });
}
async function fetchSources(id, se=0, ep=0) {
    let ep2 = '/api/sources/'+id;
    const qp = new URLSearchParams();
    if (se>0||ep>0){ qp.set('season',se); qp.set('episode',ep); }
    const qs = qp.toString(); if(qs) ep2+='?'+qs;
    const res = await fetchAPI(ep2);
    let sources=[], captions=[];
    if (res&&res.data) {
        if (Array.isArray(res.data.processedSources)) sources=res.data.processedSources;
        else if (Array.isArray(res.data.downloads))   sources=res.data.downloads;
        else if (Array.isArray(res.data))             sources=res.data;
        if (Array.isArray(res.data.captions)) captions=res.data.captions;
    } else if (res&&Array.isArray(res.processedSources)) sources=res.processedSources;
    if (res&&Array.isArray(res.captions)) captions=res.captions;
    return { sources: enhanceSources(sources), captions };
}

async function fetchCaptions(id, se=0, ep=0) {
    let endpoint = '/api/captions/' + encodeURIComponent(id);
    const qp = new URLSearchParams();
    if (se > 0 || ep > 0) {
        qp.set('season', se);
        qp.set('episode', ep);
    }
    const query = qp.toString();
    if (query) endpoint += '?' + query;

    const response = await fetchAPI(endpoint);
    const captions = response?.data?.captions || response?.captions || (Array.isArray(response?.data) ? response.data : []);
    if (!Array.isArray(captions)) return [];
    return captions.map(c => ({
        ...c,
        lan: c.language || c.lan || '',
        lanName: c.languageName || c.lanName || c.label || c.language || 'Subtitle',
        url: c.url || c.file || c.src || c.subtitleUrl || ''
    })).filter(c => c.url);
}

// ── Stream loading ──────────────────────────────────────────────────────────
function isDashSource(src, url) {
    return String(src?.format || '').toLowerCase() === 'dash' || /\.mpd(?:[?#]|$)/i.test(url || '');
}

// Prefer the signed CDN URL so the viewer's browser makes the media request.
// The VPS proxy remains available as a fallback for browser/CORS failures.
function getPlaybackUrl(src, useProxy = false) {
    if (isDashSource(src)) return src.proxyUrl||src.streamUrl||src.directUrl||src.cdnUrl||src.url||'';
    // MP4 sources with provider signing data use the same-origin session proxy
    // by default; the raw CDN URL remains available for diagnostics.
    if (src.proxyPreferred || useProxy) return src.streamUrl||src.proxyUrl||src.directUrl||src.cdnUrl||src.url||'';
    return src.directUrl||src.cdnUrl||src.streamUrl||src.proxyUrl||src.url||'';
}

function resetDashPlayer() {
    if (dashRetryTimer) {
        clearTimeout(dashRetryTimer);
        dashRetryTimer = null;
    }
    if (dashPlayer) {
        try { dashPlayer.reset(); } catch (e) { console.warn('[DASH] reset failed', e); }
        dashPlayer = null;
    }
    dashQualityOptions = [];
    activeDashQuality = -1;
}

function scheduleDashRetry(src, url) {
    if (dashRetryCount >= DASH_RETRY_LIMIT) {
        dashRetryCount = 0;
        handleVideoError();
        return;
    }

    dashRetryCount++;
    const attempt = dashRetryCount;
    const delay = attempt * 1000;
    console.warn(`[DASH] Retrying failed playback in ${delay}ms (attempt ${attempt}/${DASH_RETRY_LIMIT})`);
    dashRetryTimer = setTimeout(() => {
        dashRetryTimer = null;
        if (currentSrcIdx < allSources.length && allSources[currentSrcIdx] === src) {
            loadStream(src, { preserveDashRetries: true });
        }
    }, delay);
}

function loadStream(src, options = {}) {
    if (!options.useProxy && !options.preserveDashRetries) recoveryAttempts = 0;
    if (hls){ hls.destroy(); hls=null; }
    resetDashPlayer();
    if (!options.preserveDashRetries) dashRetryCount = 0;
    const useProxy = options.useProxy === true;
    const url = getPlaybackUrl(src, useProxy);
    if (!url){ showError('No stream URL.'); return; }

    video._hmPlaybackSource = src;
    video._hmPlaybackViaProxy = useProxy || Boolean(src.proxyPreferred);
    video.onerror = handleVideoError;

    if (isDashSource(src, url)) {
        if (!window.dashjs || !window.dashjs.MediaPlayer) {
            console.error('[DASH] dash.js did not load');
            showError('DASH player failed to load.');
            return;
        }

        const headerName = src.signHeaderKey || 'X-MB-Token';
        const headerValue = src.signCookie || '';
        dashPlayer = window.dashjs.MediaPlayer().create();
        try {
            dashPlayer.updateSettings({
                streaming: {
                    retryAttempts: {
                        MPD: 2,
                        InitializationSegment: 3,
                        IndexSegment: 3,
                        MediaSegment: 3,
                        BitstreamSwitchingSegment: 3
                    },
                    retryIntervals: {
                        MPD: 800,
                        InitializationSegment: 800,
                        IndexSegment: 800,
                        MediaSegment: 1000,
                        BitstreamSwitchingSegment: 1000
                    }
                }
            });
        } catch (e) {
            console.warn('[DASH] Retry settings unavailable', e);
        }
        if (headerValue) {
            dashPlayer.extend('RequestModifier', function() {
                return {
                    modifyRequestURL: function(requestUrl) { return requestUrl; },
                    modifyRequestHeader: function(xhr) {
                        xhr.setRequestHeader(headerName, headerValue);
                        return xhr;
                    }
                };
            }, true);
        }
        dashPlayer.on(window.dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
            // DASH exposes adaptive representations only after the MPD is ready.
            // Replace the source-level picker with the real 480p/720p/1080p tracks.
            activeDashQuality = -1;
            updateDashQualityUI();
        });
        dashPlayer.on(window.dashjs.MediaPlayer.events.ERROR, function(event) {
            console.error('[DASH] playback error', event);
            if (event && event.error && event.error.fatal) scheduleDashRetry(src, url);
        });
        dashPlayer.initialize(video, url, true);
        console.log('[DASH] Initialized signed DASH playback');
        return;
    }

    if (Hls.isSupported() && (url.includes('.m3u8')||src.format==='m3u8')) {
        hls = new Hls({ enableWorker:true, lowLatencyMode:false });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ video.play().catch(()=>{}); });
        hls.on(Hls.Events.ERROR, (e,d)=>{ if(d.fatal) handleVideoError(); });
    } else if (video.canPlayType('application/vnd.apple.mpegurl') && url.includes('.m3u8')) {
        video.src=url; video.play().catch(()=>{});
    } else {
        video.src=url; video.play().catch(()=>{});
    }
}

async function handleVideoError() {
    if (recoveryInFlight) return;
    recoveryInFlight = true;
    try {
        const src = video.src || '';
        const failedSource = video._hmPlaybackSource || allSources[currentSrcIdx];

        // Refresh an expired signed URL only once per selected source.
        if (isUrlExpired(src) && currentMovieId && recoveryAttempts < 1) {
            recoveryAttempts++;
            const resumeAt = video.currentTime;
            try {
                const fresh = await fetchSources(currentMovieId, currentSeason, currentEpisode);
                const freshSource = fresh.sources[currentSrcIdx] || fresh.sources[0];
                if (freshSource) {
                    loadStream(freshSource, { preserveDashRetries: true });
                    video.addEventListener('canplay', () => {
                        video.currentTime = resumeAt;
                        video.play().catch(() => {});
                    }, { once: true });
                    return;
                }
            } catch (e) {
                console.warn('[REFRESH] Source refresh failed:', e.message);
            }
        }

        // A direct CDN request can fail because of browser CORS. Try the VPS
        // proxy once for MP4/HLS; DASH remains direct because relative segment
        // URLs would not be rewritten by the simple proxy.
        const canUseProxyFallback = failedSource &&
            !video._hmPlaybackViaProxy &&
            !isDashSource(failedSource, src) &&
            Boolean(failedSource.streamUrl || failedSource.proxyUrl) &&
            recoveryAttempts < 2;
        if (canUseProxyFallback) {
            recoveryAttempts++;
            console.warn('[PLAYBACK] Direct CDN load failed; trying VPS proxy once');
            loadStream(failedSource, { useProxy: true });
            return;
        }

        currentSrcIdx++;
        if (currentSrcIdx < allSources.length) {
            loadStream(allSources[currentSrcIdx]);
            updateQualityUI(allSources, currentSrcIdx);
        } else {
            showError('Stream unavailable. Try going back and reopening.');
        }
    } finally {
        recoveryInFlight = false;
    }
}

// ── Stall recovery (12 s) ───────────────────────────────────────────────────
video.addEventListener('timeupdate', ()=>{ lastProgressTime=Date.now(); clearStall(); });
function clearStall(){ if(stallTimer){clearTimeout(stallTimer);stallTimer=null;} }
function scheduleStall(){
    clearStall();
    stallTimer = setTimeout(()=>{
        if (video.paused||video.ended) return;
        if (Date.now()-lastProgressTime<12000) return;
        const at = video.currentTime;
        video.load();
        video.addEventListener('canplay',()=>{ video.currentTime=at; video.play().catch(()=>{}); },{once:true});
    }, 12000);
}
video.addEventListener('waiting',  scheduleStall);
video.addEventListener('stalled',  scheduleStall);
video.addEventListener('playing',  clearStall);

// ── Progress bar / seek ─────────────────────────────────────────────────────
const progContainer = document.getElementById('progressContainer');
let seekHideTimer = null;
function doSeek(clientX) {
    if (!video.duration) return;
    const rect = progContainer.getBoundingClientRect();
    const pct  = Math.max(0, Math.min(1,(clientX-rect.left)/rect.width));
    video.currentTime = pct * video.duration;
    progressBar.style.width = (pct*100)+'%';
    seekToast.textContent = fmt(video.currentTime)+' / '+fmt(video.duration);
    seekToast.classList.add('show');
    clearTimeout(seekHideTimer);
    seekHideTimer = setTimeout(()=>seekToast.classList.remove('show'),600);
}
progContainer.addEventListener('click', e=>doSeek(e.clientX));
progContainer.addEventListener('mousedown', e=>{ isSeeking=true; doSeek(e.clientX); });
document.addEventListener('mousemove',  e=>{ if(isSeeking) doSeek(e.clientX); });
document.addEventListener('mouseup',    ()=>{ isSeeking=false; seekToast.classList.remove('show'); });
progContainer.addEventListener('touchstart', e=>{ isSeeking=true; doSeek(e.touches[0].clientX); },{passive:true});
document.addEventListener('touchmove',  e=>{ if(isSeeking) doSeek(e.touches[0].clientX); },{passive:true});
document.addEventListener('touchend',   ()=>{ isSeeking=false; seekToast.classList.remove('show'); });

// ── Playback controls ───────────────────────────────────────────────────────
function doPlay()      { showSpinner(); video.play().catch(()=>{}); }
function togglePlay()  { video.paused ? video.play().catch(()=>{}) : video.pause(); }
function skip(s)       { video.currentTime=Math.max(0,Math.min(video.duration||0,video.currentTime+s)); }
function updateMuteButton() {
    const muteBtn = document.getElementById('muteBtn');
    if (!muteBtn) return;
    muteBtn.innerHTML = (video.muted || video.volume === 0)
        ? '<i class="fas fa-volume-mute"></i>'
        : '<i class="fas fa-volume-up"></i>';
}
function toggleMute() {
    video.muted = !video.muted;
    updateMuteButton();
}
function adjustVolume(delta) {
    const next = Math.max(0, Math.min(1, (Number.isFinite(video.volume) ? video.volume : 1) + delta));
    video.volume = next;
    if (next > 0 && video.muted) video.muted = false;
    updateMuteButton();
    showQuickMsg('Volume ' + Math.round(next * 100) + '%', 'info');
}
function toggleKeyboardSubtitles() {
    const tracks = Array.from(video.textTracks || []);
    if (!tracks.length) {
        showQuickMsg('No subtitles available', 'error');
        return;
    }
    const showing = tracks.find(track => track.mode === 'showing');
    if (showing) {
        selectSubtitle('off');
        showQuickMsg('Subtitles off', 'info');
        return;
    }
    const first = tracks.find(track => track.language || track.label) || tracks[0];
    const language = first.language || first.srclang || 'en';
    selectSubtitle(language);
    showQuickMsg('Subtitles on', 'info');
}

function playerKeyboardAllowed(event) {
    if (document.hidden) return false;
    if (window.innerWidth <= 768 && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window)) return false;
    const target = event.target instanceof Element ? event.target : null;
    if (target && (target.matches('input,textarea,select,[contenteditable="true"]') || target.closest('button,a,[role="button"]'))) return false;
    return Boolean(video && container && (video.readyState > 0 || video.currentSrc || video.src || document.fullscreenElement === container));
}
document.addEventListener('keydown', function handlePlayerKeyboard(event) {
    if (!playerKeyboardAllowed(event)) return;
    const key = event.key;
    const lower = key.toLowerCase();
    if (key === '?' || (key === '/' && event.shiftKey)) {
        event.preventDefault();
        showKeyboardHelp();
        return;
    }
    if (key === 'Escape') {
        if (document.getElementById('keyboardShortcutsHelp')) {
            event.preventDefault();
            document.getElementById('keyboardShortcutsHelp').remove();
        } else if (document.fullscreenElement === container) {
            event.preventDefault();
            toggleFullscreen();
        }
        return;
    }
    const digit = /^[0-9]$/.test(key);
    const handled = key === ' ' || event.code === 'Space' || ['k','arrowleft','arrowright','arrowup','arrowdown','j','l','m','f','c','home','end','<','>'].includes(lower) || digit;
    if (!handled) return;
    event.preventDefault();
    if (key === ' ' || event.code === 'Space' || lower === 'k') {
        togglePlay();
    } else if (lower === 'arrowleft') {
        skip(-5); showQuickMsg('-5 seconds', 'info');
    } else if (lower === 'arrowright') {
        skip(5); showQuickMsg('+5 seconds', 'info');
    } else if (lower === 'j') {
        skip(-10); showQuickMsg('-10 seconds', 'info');
    } else if (lower === 'l') {
        skip(10); showQuickMsg('+10 seconds', 'info');
    } else if (lower === 'arrowup') {
        adjustVolume(0.05);
    } else if (lower === 'arrowdown') {
        adjustVolume(-0.05);
    } else if (lower === 'm') {
        toggleMute();
        showQuickMsg(video.muted ? 'Muted' : 'Unmuted', 'info');
    } else if (lower === 'f') {
        toggleFullscreen();
    } else if (lower === 'c') {
        toggleKeyboardSubtitles();
    } else if (digit) {
        if (video.duration) video.currentTime = video.duration * (Number(key) / 10);
    } else if (key === '<' || key === '>') {
        const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
        const currentIndex = speeds.indexOf(video.playbackRate);
        const nextIndex = Math.max(0, Math.min(speeds.length - 1, currentIndex + (key === '>' ? 1 : -1)));
        setPlaybackSpeed(speeds[nextIndex]);
        showQuickMsg('Speed ' + speeds[nextIndex] + 'x', 'info');
    } else if (lower === 'home') {
        video.currentTime = 0;
    } else if (lower === 'end' && video.duration) {
        video.currentTime = video.duration;
    }
});

// ── 4-level Zoom ────────────────────────────────────────────────────────────
function cycleZoom() {
    zoomLevel = (zoomLevel+1) % 4;
    const zBtn = document.getElementById('zoomBtn');
    if (zoomLevel===0) {
        video.style.objectFit='contain'; video.style.transform='scale(1)';
        zBtn.classList.remove('active'); zBtn.innerHTML='<i class="fas fa-expand-alt"></i>';
    } else if (zoomLevel===1) {
        video.style.objectFit='fill'; video.style.transform='scale(1)';
        zBtn.classList.add('active'); zBtn.innerHTML='<i class="fas fa-search-plus"></i>';
    } else if (zoomLevel===2) {
        video.style.objectFit='fill'; video.style.transform='scale(1.05)';
        zBtn.classList.add('active'); zBtn.innerHTML='<i class="fas fa-search-plus"></i>';
    } else {
        video.style.objectFit='fill'; video.style.transform='scale(1.15)';
        zBtn.classList.add('active'); zBtn.innerHTML='<i class="fas fa-search-minus"></i>';
    }
}

async function loadDubs(id, detailPath) {
    const cont=document.getElementById('dubSelectorContainer');
    if(cont) cont.style.display='block';
    try {
        const dubUrl='/api/dubs/'+id+(detailPath?'?detailPath='+encodeURIComponent(detailPath):'');
        const d=await fetchAPI(dubUrl);
        const data=d?.data||{};
        if (d.status==='success' && (data.hasDubs || (Array.isArray(data.dubs)&&data.dubs.length))) {
            currentDubsData={
                ...data,
                dubs:Array.isArray(data.dubs)?data.dubs:[],
                original:data.original||null
            };
            renderDubOptions(id);
        } else showDubUnavailable();
    } catch(e) { showDubUnavailable('Audio languages unavailable'); }
}
function renderDubOptions(activeId) {
    const cont=document.getElementById('dubSelectorContainer');
    const list=document.getElementById('dubOptionsList');
    const btn=document.getElementById('dubBtn');
    if (!cont||!list) return;
    const all=[];
    if (currentDubsData.original) all.push(currentDubsData.original);
    // The upstream catalog mixes subtitle variants (for example "Arabic sub")
    // into the dub list. Keep those out of the audio-language picker.
    (currentDubsData.dubs||[])
        .filter(d=>!/(^|\s)sub(\s|$)/i.test(String(d.lanName||d.lanCode||"")))
        .forEach(d=>all.push(d));
    if (all.length<=1){ showDubUnavailable(); return; }
    list.innerHTML='';
    if (btn) {
        btn.classList.remove('unavailable');
        btn.title='Audio language';
        btn.setAttribute('aria-label','Audio language');
    }
    all.forEach(d=>{
        const subjectId=String(d.subjectId||'');
        const div=document.createElement('div');
        div.className='dub-option'+(subjectId===String(activeId||'')?' dub-active':'');
        const chk=document.createElement('i');
        chk.className='fas fa-check dub-check'; div.appendChild(chk);
        const name=d.lanName||d.lanCode||'Audio';
        div.appendChild(document.createTextNode(name));
        div.addEventListener('click',()=>selectDub(subjectId,name,d.detailPath||''));
        list.appendChild(div);
    });
    cont.style.display='block';
}
async function selectDub(subjectId, lanName, detailPath) {
    document.getElementById('dubPanel').style.display='none';
    document.getElementById('dubPanel').classList.remove('player-floating-dub');
    if (!subjectId||subjectId===currentMovieId) return;
    showQuickMsg('Switching to '+lanName+'…','info');
    try {
        const [sd, dubCaptions]=await Promise.all([
            fetchSources(subjectId,currentSeason||0,currentEpisode||0),
            fetchCaptions(subjectId,currentSeason||0,currentEpisode||0).catch(()=>[])
        ]);
        if (!sd||!sd.sources||!sd.sources.length){
            document.querySelectorAll('.dub-option').forEach(option=>{
                if (option.textContent.trim()===lanName){
                    option.classList.add('dub-empty');
                    option.style.pointerEvents='none';
                    option.title='No playable source available';
                    option.textContent=lanName+' — unavailable';
                }
            });
            showQuickMsg('No playable stream for '+lanName,'error');
            return;
        }
        currentMovieId=subjectId;
        allSources=sd.sources;
        const pick=sd.sources.find(s=>isDashSource(s,s.directUrl||s.cdnUrl||s.streamUrl))||sd.sources.find(s=>String(s.quality||'').includes('360'))||sd.sources[0];
        currentSrcIdx=sd.sources.indexOf(pick);
        updateQualityUI(sd.sources, currentSrcIdx);
        loadCaptionTracks(dubCaptions.length?dubCaptions:(sd.captions||[]));
        loadStream(pick);
        renderDubOptions(subjectId);
        showQuickMsg('Now playing: '+lanName,'success');
    } catch(err){ showQuickMsg('Failed to load '+lanName,'error'); }
}

function positionPlayerPopup(popup, anchor, preferAbove) {
    if (!popup || !anchor || popup.style.display==='none') return;
    popup.style.position='fixed';
    popup.style.left='auto';
    popup.style.right='auto';
    popup.style.bottom='auto';
    popup.style.transform='none';
    const rect=anchor.getBoundingClientRect();
    const pad=8;
    const gap=8;
    const width=popup.offsetWidth||180;
    const height=popup.offsetHeight||160;
    const maxLeft=Math.max(pad,window.innerWidth-width-pad);
    const left=Math.min(Math.max(pad,rect.right-width),maxLeft);
    let top=preferAbove ? rect.top-height-gap : rect.bottom+gap;
    if (top<pad || (!preferAbove && top+height>window.innerHeight-pad)) {
        const above=rect.top-height-gap;
        const below=rect.bottom+gap;
        top=(above>=pad || below+height>window.innerHeight-pad)?above:below;
    }
    top=Math.min(Math.max(pad,top),Math.max(pad,window.innerHeight-height-pad));
    popup.style.left=Math.round(left)+'px';
    popup.style.top=Math.round(top)+'px';
}

function updateDashQualityUI() {
    const list = document.getElementById('qualityPopupList');
    const lbl = document.getElementById('qualityBtnLabel');
    if (!list || !dashPlayer || typeof dashPlayer.getBitrateInfoListFor !== 'function') return;

    const representations = dashPlayer.getBitrateInfoListFor('video') || [];
    const seen = new Set();
    dashQualityOptions = representations
        .slice()
        .sort((a,b) => (Number(b.height)||0) - (Number(a.height)||0) || (Number(b.bitrate)||0) - (Number(a.bitrate)||0))
        .map((info, position) => {
            const height = Number(info.height) || 0;
            const bitrate = Number(info.bitrate) || 0;
            const label = height ? height + 'p' : (bitrate ? Math.round(bitrate / 1000) + ' kbps' : 'Track ' + (position + 1));
            const key = height ? 'height:' + height : 'bitrate:' + bitrate;
            if (seen.has(key)) return null;
            seen.add(key);
            return {
                qualityIndex: Number.isFinite(Number(info.qualityIndex)) ? Number(info.qualityIndex) : position,
                label
            };
        })
        .filter(Boolean);

    list.innerHTML = '';
    renderQualityItem(list, 'Auto', activeDashQuality === -1, () => switchDashQuality(-1));
    dashQualityOptions.forEach(option => {
        renderQualityItem(list, option.label, activeDashQuality === option.qualityIndex,
            () => switchDashQuality(option.qualityIndex));
    });
    if (lbl) lbl.textContent = activeDashQuality === -1
        ? 'Auto'
        : (dashQualityOptions.find(o => o.qualityIndex === activeDashQuality)?.label || 'Quality');
}

function updateQualityUI(sources, activeIdx) {
    const list = document.getElementById('qualityPopupList');
    const lbl  = document.getElementById('qualityBtnLabel');
    if (!list) return;
    dashQualityOptions = [];
    list.innerHTML = '';

    const visible = [];
    const byQuality = new Map();
    sources.forEach((source, index) => {
        const url = source?.streamUrl||source?.proxyUrl||source?.directUrl||source?.cdnUrl||source?.url||'';
        const isDash = isDashSource(source, url);
        const label = sourceQualityLabel(source, index);
        const key = isDash ? 'dash' : 'mp4:' + label;
        const previous = byQuality.get(key);
        // Keep one entry per quality, but prefer the currently active duplicate.
        if (!previous || index === activeIdx) {
            const entry = { index, label };
            byQuality.set(key, entry);
            if (previous) visible[visible.indexOf(previous)] = entry;
            else visible.push(entry);
        }
    });

    visible.forEach(entry => {
        renderQualityItem(list, entry.label, entry.index === activeIdx,
            () => switchQuality(entry.index));
    });
    if (lbl && sources[activeIdx]) lbl.textContent = sourceQualityLabel(sources[activeIdx], activeIdx);
}

// ── Quality switch ────────────────────────────────────────────
function switchDashQuality(qualityIndex) {
    if (!dashPlayer) return;
    const index = Number(qualityIndex);
    try {
        if (index < 0) {
            dashPlayer.setAutoSwitchQualityFor('video', true);
            activeDashQuality = -1;
        } else {
            dashPlayer.setAutoSwitchQualityFor('video', false);
            dashPlayer.setQualityFor('video', index);
            activeDashQuality = index;
        }
        updateDashQualityUI();
        closeAllPlayerPopups();
    } catch (error) {
        console.warn('[DASH] Quality switch failed:', error);
        showQuickMsg('Quality change unavailable', 'error');
    }
}

function switchQuality(idx) {
    if (idx==='' || idx===undefined) return;
    currentSrcIdx=parseInt(idx);
    const pos=video.currentTime; const paused=video.paused;
    updateQualityUI(allSources, currentSrcIdx);
    closeAllPlayerPopups();
    loadStream(allSources[currentSrcIdx]);
    video.addEventListener('playing',()=>{ if(pos>0) video.currentTime=pos; if(!paused) video.play().catch(()=>{}); },{once:true});
}

// ── Touch gestures: left=volume, right=brightness ────────────────────────────
let gestureType=null, gestureStartY=0, gestureStartX=0, isGesturing=false, gestureHideTimer=null;
const videoWrapper=document.querySelector('.video-wrapper');
videoWrapper.addEventListener('touchstart',e=>{
    if(e.target.closest('.custom-controls')||e.target.closest('.big-play-btn')) return;
    const t=e.touches[0];
    gestureStartY=t.clientY; gestureStartX=t.clientX;
    const rect=videoWrapper.getBoundingClientRect();
    gestureType=(t.clientX-rect.left)>rect.width/2?'brightness':'volume';
    gestureIcon.innerHTML=gestureType==='brightness'?'<i class="fas fa-sun"></i>':'<i class="fas fa-volume-up"></i>';
},{passive:true});
videoWrapper.addEventListener('touchmove',e=>{
    if (!gestureType) return;
    const t=e.touches[0];
    const dy=gestureStartY-t.clientY;
    const dx=Math.abs(t.clientX-gestureStartX);
    if (dx>30&&!isGesturing) return;
    if (Math.abs(dy)>15) {
        isGesturing=true; e.preventDefault();
        const sens=0.005;
        if (gestureType==='brightness') {
            videoBrightness=Math.max(.1,Math.min(1,videoBrightness+(dy*sens)));
            video.style.filter=`brightness(${videoBrightness})`;
            const pct=Math.round(videoBrightness*100);
            gestureBarFill.style.width=pct+'%'; gestureBarFill.style.background='#FFD700';
            gestureValue.textContent=pct+'%';
        } else {
            const vol=Math.max(0,Math.min(1,video.volume+(dy*sens)));
            video.volume=vol;
            const pct=Math.round(vol*100);
            gestureBarFill.style.width=pct+'%'; gestureBarFill.style.background='#3b82f6';
            gestureValue.textContent=pct+'%';
            gestureIcon.innerHTML=vol===0?'<i class="fas fa-volume-mute"></i>':vol<.5?'<i class="fas fa-volume-down"></i>':'<i class="fas fa-volume-up"></i>';
        }
        gestureEl.classList.add('show'); gestureStartY=t.clientY;
        clearTimeout(gestureHideTimer);
    }
},{passive:false});
videoWrapper.addEventListener('touchend',()=>{
    if(isGesturing) gestureHideTimer=setTimeout(()=>gestureEl.classList.remove('show'),500);
    isGesturing=false; gestureType=null;
},{passive:true});

    const [srcData, infoData] = await Promise.allSettled([
        fetchSources(movieId, season, episode),
        fetchAPI('/api/info/'+movieId)
    ]);

    // ── Sources ──
    // Movie pages should never use episode parameters. A stale or copied
    // /watch/<movie>?season=1&episode=1 URL otherwise receives an empty
    // episode response even though the movie itself has playable sources.
    let resolvedSrcData = srcData;
    const infoSubject = infoData.status==='fulfilled' && infoData.value && infoData.value.data && infoData.value.data.subject;
    const isMovieWithEpisodeParams = infoSubject && Number(infoSubject.subjectType) === 1 && (season > 0 || episode > 0);
    if (isMovieWithEpisodeParams) {
        const movieSources = await fetchSources(movieId, 0, 0);
        if (movieSources.sources.length) {
            resolvedSrcData = { status: 'fulfilled', value: movieSources };
            currentSeason = 0;
            currentEpisode = 0;
        }
    }

    if (resolvedSrcData.status==='fulfilled'&&resolvedSrcData.value.sources.length) {
        const {sources}=resolvedSrcData.value;
        let captions = resolvedSrcData.value.captions || [];
        try {
            // The captions endpoint returns same-origin proxy URLs. Direct
            // provider caption URLs often fail in mobile browsers because of CORS.
            const proxiedCaptions = await fetchCaptions(movieId, currentSeason, currentEpisode);
            if (proxiedCaptions.length) captions = proxiedCaptions;
        } catch (error) {
            console.warn('[SUBTITLES] Caption lookup failed:', error.message);
        }
        allSources=sources;

        // Prefer the signed DASH source; fall back to browser-compatible MP4.
        // DASH is the working path when the VPS/CDN rate-limits MP4 requests.
        const dashIdx=sources.findIndex(s=>isDashSource(s,s.directUrl||s.cdnUrl||s.streamUrl));
        const mp4Idx=sources.findIndex(s=>!isDashSource(s,s.directUrl||s.cdnUrl||s.streamUrl));
        const mp4_360Idx=sources.findIndex(s=>!isDashSource(s,s.directUrl||s.cdnUrl||s.streamUrl) && String(s.quality||s.label||'').includes('360'));
        const preferIdx=dashIdx>=0 ? dashIdx : (mp4_360Idx>=0 ? mp4_360Idx : (mp4Idx>=0 ? mp4Idx : Math.max(0,sources.findIndex(s=>String(s.quality||s.label||'').includes('360')))));
        currentSrcIdx=preferIdx;
        updateQualityUI(sources, currentSrcIdx);
        loadCaptionTracks(captions);
        restorePosition();
        loadStream(sources[currentSrcIdx]);

        // Load dubs async — pass detailPath so the endpoint skips an extra info lookup
        const _dubDp=(infoData.status==='fulfilled'&&infoData.value&&infoData.value.data&&infoData.value.data.subject&&infoData.value.data.subject.detailPath)||null;
        loadDubs(movieId, _dubDp);
    } else {
        showError('No streams found for this title.');
        return;
    }

    // ── Movie info ──
    if (infoData.status==='fulfilled') {
        const json=infoData.value;
        const s=json&&json.data&&json.data.subject;
        if (!s) return;

        const title  = s.name||s.title||titleHint||'Watch Movie';
        const isTV   = s.subjectType===2;

        document.getElementById('watchTitle').textContent = title+(season?' S'+season+(episode?'E'+episode:''):'');
        document.title = title+(season?' S'+season+'E'+(episode||1):'')+' - HM CINEMA';
        if (season) document.getElementById('epLabel').textContent='S'+season+' E'+(episode||1);

        // ── Header: title + meta + download ──
        const header=document.getElementById('wbHeader');
        document.getElementById('wbTitle').textContent=title;
        const metaParts=[];
        if (s.score||s.rating) metaParts.push(`<span class="wb-rating"><i class="fas fa-star"></i> ${(s.score||s.rating||'').toString().slice(0,3)}</span>`);
        if (s.year||s.releaseYear) metaParts.push(`<span>${s.year||s.releaseYear}</span>`);
        if (s.area||s.country) metaParts.push(`<span>${(s.area||s.country||[]).toString().split(',')[0]}</span>`);
        if (isTV) metaParts.push(`<span>TV Series</span>`);
        document.getElementById('wbMeta').innerHTML=metaParts.join('<span style="color:#333">·</span>');
        header.style.display='block';

        // Store for download
        window._watchTitle  = title;
        window._watchType   = isTV ? 2 : 1;
        window._watchId     = movieId;
        var dlBtnEl = document.getElementById("watchDlBtn");
        if (dlBtnEl) dlBtnEl.style.display = "";

        if (isTV) {
            const seasons=(s.resource&&s.resource.seasons)||s.seasons||[];
            if (seasons.length) {
                const navEl=document.getElementById('watchEpNav');
                const grid=document.getElementById('epNavGrid');
                const tabsEl=document.getElementById('epSeasonTabs');

                // Build season tabs
                let tabsHtml='';
                seasons.forEach(sv=>{
                    const sNum=sv.se||sv.season||1;
                    const active=sNum===season;
                    tabsHtml+=`<a class="ep-season-tab${active?' active':''}" href="/watch/${movieId}?season=${sNum}&episode=1&title=${encodeURIComponent(title)}">Season ${sNum}</a>`;
                });
                tabsEl.innerHTML=tabsHtml;

                // Build episode grid for current season
                const curSe=seasons.find(sv=>(sv.se||sv.season)===season)||seasons[0];
                const epCnt=parseInt(curSe.maxEp||curSe.episodes||curSe.epCount||1);
                const se=curSe.se||curSe.season||1;

                let epHtml='';
                for (let ep=1;ep<=epCnt;ep++) {
                    const cur=(ep===(episode||1)&&se===season);
                    epHtml+=`<a class="ep-nav-btn${cur?' current':''}" href="/watch/${movieId}?season=${se}&episode=${ep}&title=${encodeURIComponent(title)}">${ep}</a>`;
                }
                grid.innerHTML=epHtml;
                navEl.style.display='block';

                episodeList=[];
                for(let ep=1;ep<=epCnt;ep++) episodeList.push({season:se,episode:ep});
                currentEpIdx=Math.max(0,(episode||1)-1);

                if (episodeList.length>1) {
                    if (currentEpIdx>0) document.getElementById('prevBtn').style.display='';
                    if (currentEpIdx<episodeList.length-1) document.getElementById('nextBtn').style.display='';
                }
            }
        }
    }
}

init();


/* == Watch page download == */
function startWatchDownload() {
    var params  = new URLSearchParams(location.search);
    var se      = parseInt(params.get('season')  || '0');
    var ep      = parseInt(params.get('episode') || '0');
    var id      = window._watchId || movieId;
    var title   = window._watchTitle || document.title;
    var subType = window._watchType  || 1;
    watchDownloadContent(id, subType, title, se, ep);
}
function dedupeDownloadSources(sources) {
    var bestByQuality = new Map();
    sources.forEach(function(source, index){
        var label = sourceQualityLabel(source, index);
        var key = label.trim().toLowerCase().replace(/\s+/g, ' ');
        var score = (source.downloadUrl ? 8 : 0) +
            (source.directUrl ? 4 : 0) +
            (source.url ? 2 : 0) +
            (source.streamUrl ? 1 : 0);
        var current = bestByQuality.get(key);
        if (!current || score > current.score) {
            bestByQuality.set(key, { source: source, score: score });
        }
    });
    return Array.from(bestByQuality.values()).map(function(item){ return item.source; });
}

async function watchDownloadContent(id, subjectType, movieTitle, se, ep) {
    var overlay = document.createElement('div');
    overlay.id = 'wdlOverlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:5000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;backdrop-filter:blur(8px)';
    var spinnerDiv = document.createElement('div');
    spinnerDiv.style.cssText = 'width:52px;height:52px;border-radius:50%;background:rgba(229,9,20,.1);display:flex;align-items:center;justify-content:center';
    spinnerDiv.innerHTML = '<div style="width:34px;height:34px;border:3px solid rgba(255,255,255,.1);border-top-color:#e50914;border-radius:50%;animation:wdlspin .8s linear infinite"></div>';
    var statusDiv = document.createElement('div');
    statusDiv.id = 'wdlStatus';
    statusDiv.style.cssText = 'color:#fff;font-size:15px;font-weight:600';
    statusDiv.textContent = 'Fetching sources...';
    var cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.style.cssText = 'margin-top:8px;background:none;border:1px solid rgba(255,255,255,.2);color:#fff;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px';
    cancelBtn.onclick = function(){ var e=document.getElementById('wdlOverlay'); if(e) e.remove(); };
    var spinStyle = document.createElement('style');
    spinStyle.textContent = '@keyframes wdlspin{to{transform:rotate(360deg)}}';
    overlay.appendChild(spinnerDiv);
    overlay.appendChild(statusDiv);
    overlay.appendChild(cancelBtn);
    overlay.appendChild(spinStyle);
    document.body.appendChild(overlay);
    function removeOverlay(){ var e=document.getElementById('wdlOverlay'); if(e) e.remove(); }
    function setStatus(msg){ var e=document.getElementById('wdlStatus'); if(e) e.textContent=msg; }
    try {
        var ep2 = '/api/sources/' + id;
        var qp  = new URLSearchParams();
        if (se > 0 || ep > 0) { qp.set('season', se); qp.set('episode', ep); }
        var qs = qp.toString(); if (qs) ep2 += '?' + qs;
        var res  = await fetch(ep2, { credentials: 'include' });
        var json = await res.json();
        var sources = [];
        if (json && json.data) {
            // Prefer signed same-origin session URLs. Raw CDN URLs are rate-limited
            // when sent through the generic /api/download relay.
            if (Array.isArray(json.data.processedSources) && json.data.processedSources.length) sources = json.data.processedSources;
            else if (Array.isArray(json.data.downloads) && json.data.downloads.length) sources = json.data.downloads;
            else if (Array.isArray(json.data))             sources = json.data;
        }
        // DASH manifests are playback sources, not downloadable video files.
        // Sending an .mpd through the download proxy only downloads the tiny
        // manifest, which is why the old first option produced a KB file.
        var valid = sources.filter(function(s){
            var sourceUrl = s.streamUrl || s.proxyUrl || s.directUrl || s.cdnUrl || s.url || '';
            var hasFile = s.downloadUrl || s.directUrl || s.url || s.streamUrl;
            return hasFile && !isDashSource(s, sourceUrl);
        });
        valid = dedupeDownloadSources(valid);
        if (!valid.length) { setStatus('No downloadable MP4 sources available'); setTimeout(removeOverlay, 2500); return; }
        removeOverlay();
        if (valid.length === 1) { triggerWatchDl(valid[0], movieTitle, se, ep); return; }
        var picker = document.createElement('div');
        picker.id = 'wdlPicker';
        picker.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:5000;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;backdrop-filter:blur(8px)';
        var heading = document.createElement('div');
        heading.style.cssText = 'color:#fff;font-weight:700;font-size:16px;margin-bottom:4px';
        heading.textContent = 'Choose quality';
        picker.appendChild(heading);
        valid.forEach(function(s, i){
            var q = sourceQualityLabel(s, i);
            var btn = document.createElement('button');
            btn.style.cssText = 'background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:10px 32px;border-radius:8px;cursor:pointer;font-size:14px;min-width:180px';
            btn.textContent = q;
            btn.onclick = (function(src){ return function(){
                document.getElementById('wdlPicker').remove();
                triggerWatchDl(src, movieTitle, se, ep);
            }; })(s);
            picker.appendChild(btn);
        });
        var cancelPicker = document.createElement('button');
        cancelPicker.style.cssText = 'margin-top:4px;background:none;border:1px solid rgba(255,255,255,.2);color:#aaa;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px';
        cancelPicker.textContent = 'Cancel';
        cancelPicker.onclick = function(){ document.getElementById('wdlPicker').remove(); };
        picker.appendChild(cancelPicker);
        document.body.appendChild(picker);
    } catch(e) {
        setStatus('Download failed');
        setTimeout(removeOverlay, 2500);
    }
}
function triggerWatchDl(source, movieTitle, se, ep) {
    var rawUrl = source.downloadUrl || source.directUrl || source.url || source.streamUrl || '';
    if (isDashSource(source, rawUrl)) {
        showQuickMsg('DASH streams are playback-only. Choose an MP4 quality.', 'error');
        return;
    }

    // Use the dedicated MP4 download relay for opaque server sessions. It
    // applies the provider headers and supplies the real video/mp4 response;
    // the friend-download path can otherwise return a small JSON rate-limit
    // error that the browser mistakenly saves as a file.
    var url = rawUrl.replace('/api/mp4/friend-download/', '/api/mp4/download/');
    var isServerDownload = url.indexOf('/api/mp4/download/') === 0 || url.indexOf('/api/download') === 0;
    var ext = isServerDownload ? 'mp4' : ((url.split('?')[0].split('.').pop() || 'mp4').slice(0,4));
    if (!/^[a-z0-9]{2,5}$/i.test(ext)) ext = 'mp4';

    var fname = movieTitle.replace(/[^a-zA-Z0-9 ]/g,'').trim() || 'movie';
    if (se > 0 && ep > 0) fname += ' S' + String(se).padStart(2,'0') + 'E' + String(ep).padStart(2,'0');
    fname += '.' + ext;

    // Server-generated relay URLs must be used directly. The server sends
    // Content-Disposition on successful MP4 responses; omit the client-side
    // download attribute so a JSON error is shown instead of saved as a file.
    var dlUrl = url.indexOf('/api/') === 0
        ? url
        : '/api/download?url=' + encodeURIComponent(url) + '&filename=' + encodeURIComponent(fname);
    if (isServerDownload && !/[?&]filename=/i.test(dlUrl)) {
        dlUrl += (dlUrl.indexOf('?') >= 0 ? '&' : '?') + 'filename=' + encodeURIComponent(fname);
    }
    var a = document.createElement('a');
    a.href = dlUrl;
    if (!isServerDownload) a.download = fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
